# cargo-deny configuration.
#
# https://embarkstudios.github.io/cargo-deny/
#
# Run locally with: cargo deny check
# CI runs it on every push (see .github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allowlist of licenses we are willing to ship.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
# `ring`'s license is OpenSSL-style and called out individually.
allow = ["OpenSSL"]
name = "ring"

[bans]
# We tolerate duplicates because the workspace pulls in keyring + keyring-core
# from different ecosystems. Tighten this once the dep tree settles.
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

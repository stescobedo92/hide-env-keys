[package]
name = "evault-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line interface and binary for evault."

[[bin]]
name = "evault"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
evault-core = { path = "../evault-core", version = "0.1" }
evault-store-memory = { path = "../evault-store-memory", version = "0.1" }
evault-tui = { path = "../evault-tui", version = "0.1" }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
secrecy = "0.10"

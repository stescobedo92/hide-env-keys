name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain explicitly via env so rustup's cargo proxy does
  # NOT re-resolve `rust-toolchain.toml` on every `cargo` invocation.
  RUSTUP_TOOLCHAIN: "1.94"

jobs:
  assert-no-openspec:
    name: Assert no openspec/ in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if openspec/ is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E "^openspec/" > /tmp/tracked_openspec.txt; then
            echo "ERROR: openspec/ contents must never be committed."
            cat /tmp/tracked_openspec.txt
            exit 1
          fi
          echo "OK: no openspec/ files tracked."

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Bypass broken cargo proxy on macOS
        # On macos-latest the `~/.cargo/bin/cargo` hardlink is
        # sometimes a copy of `rustup-init` (the installer) rather
        # than the rustup multiplexer, so `cargo <subcommand>`
        # crashes with "unexpected argument '<subcommand>'". Work
        # around it by prepending the toolchain's OWN bin directory
        # (which contains the real cargo binary, not a proxy) to
        # PATH for every subsequent step.
        # `rustup which cargo` returns the absolute path of the real
        # cargo inside the active toolchain — e.g.
        # ~/.rustup/toolchains/1.94-aarch64-apple-darwin/bin/cargo.
        # The dirname of that is what we prepend. Harmless on
        # Linux/Windows where the proxy is healthy.
        shell: bash
        run: |
          set -euo pipefail
          rustup default 1.94
          cargo_bin=$(rustup which cargo)
          echo "Real cargo at: $cargo_bin"
          dirname "$cargo_bin" >> "$GITHUB_PATH"
      - name: Sanity check toolchain
        run: |
          cargo --version
          rustc --version
          cargo clippy --version
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      # No `Swatinem/rust-cache` here. The test job builds everything
      # with `--all-features` which pulls in the SQLCipher build chain
      # (perl + OpenSSL); the cache for that combination has been
      # observed to interact badly with the rustup toolchain
      # re-resolution on macos-latest.
      - name: Bypass broken cargo proxy on macOS
        # See the matching step in the `clippy` job for context.
        shell: bash
        run: |
          set -euo pipefail
          rustup default 1.94
          cargo_bin=$(rustup which cargo)
          echo "Real cargo at: $cargo_bin"
          dirname "$cargo_bin" >> "$GITHUB_PATH"
      - name: Sanity check toolchain
        run: |
          cargo --version
          rustc --version
      - name: Install Linux deps (Secret Service for keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config gnome-keyring dbus-x11
      - name: Run tests (Linux, with headless gnome-keyring)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          eval $(dbus-launch --sh-syntax)
          eval $(echo -n "" | gnome-keyring-daemon --login)
          eval $(echo -n "" | gnome-keyring-daemon --components=secrets,ssh,pkcs11 --start)
          cargo test --workspace --all-features
      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        run: cargo test --workspace --all-features

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - name: Bypass broken cargo proxy
        # See the matching step in the `clippy` job for context.
        # Doc job only runs on Linux but the workaround is harmless
        # there, and keeping the three jobs uniform makes the
        # workflow easier to reason about.
        shell: bash
        run: |
          set -euo pipefail
          rustup default 1.94
          cargo_bin=$(rustup which cargo)
          echo "Real cargo at: $cargo_bin"
          dirname "$cargo_bin" >> "$GITHUB_PATH"
      - name: Sanity check toolchain
        run: |
          cargo --version
          rustc --version
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

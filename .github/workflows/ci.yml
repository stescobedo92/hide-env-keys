name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  assert-no-openspec:
    name: Assert no openspec/ in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if openspec/ is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E "^openspec/" > /tmp/tracked_openspec.txt; then
            echo "ERROR: openspec/ contents must never be committed."
            cat /tmp/tracked_openspec.txt
            exit 1
          fi
          echo "OK: no openspec/ files tracked."

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Sanity check the toolchain so a broken cargo proxy fails here
      # (with a clear message) rather than mid-`cargo clippy` with the
      # misleading "unexpected argument 'clippy'" symptom. Seen on
      # macos-latest where `cargo` occasionally resolves to
      # `rustup-init` after the cache restore. `rustup default` is
      # idempotent and forces the proxies to be set up correctly.
      - name: Sanity check toolchain
        run: |
          rustup default 1.94
          cargo --version
          rustc --version
          cargo clippy --version
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      # Same flaky-cargo-proxy guard as the clippy job. See its
      # `Sanity check toolchain` step for the rationale.
      - name: Sanity check toolchain
        run: |
          rustup default 1.94
          cargo --version
          rustc --version
      - name: Install Linux deps (Secret Service for keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config gnome-keyring dbus-x11
      - name: Run tests (Linux, with headless gnome-keyring)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          eval $(dbus-launch --sh-syntax)
          eval $(echo -n "" | gnome-keyring-daemon --login)
          eval $(echo -n "" | gnome-keyring-daemon --components=secrets,ssh,pkcs11 --start)
          cargo test --workspace --all-features
      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        run: cargo test --workspace --all-features

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - name: Sanity check toolchain
        run: |
          rustup default 1.94
          cargo --version
          rustc --version
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

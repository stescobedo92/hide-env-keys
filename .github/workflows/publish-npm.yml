name: Publish npm

# Triggered after the Release workflow publishes the GitHub Release
# containing the per-platform binaries. The npm package uses
# optionalDependencies for per-platform packages, so the Release MUST exist
# before this workflow publishes those packages.
#
# Two trigger modes:
#
# 1. Automatic: workflow_run on Release completion. The tag name is
#    read from the workflow_run event so the published npm version
#    matches the released binaries.
# 2. Manual: workflow_dispatch with a `version` input (and an
#    optional `source_ref` override). Useful for republishing if
#    the npm side fails after the GitHub Release is already up, or
#    if the canonical tag was cut before `npm/` was added to the
#    repository and you need to publish the wrapper from master.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the leading "v", e.g. 0.1.0)'
        required: true
      source_ref:
        description: |
          Ref to check out for the npm/ wrapper source. Defaults to the
          tag matching `version`. Override with a branch (e.g. `master`)
          when the tag was cut before the npm/ directory existed.
        required: false
        default: ""

permissions: {}

jobs:
  publish:
    name: Publish to npm
    # `contents:read` to clone, `id-token:write` so `npm publish
    # --provenance` can mint an OIDC token that npm verifies and
    # attaches to the package as a sigstore attestation.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # On `workflow_run` only proceed if the Release workflow succeeded;
    # skip silently otherwise so a failed release does not also produce
    # a noisy "npm publish failed" notification.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Resolve version and source ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
            source_ref="${{ github.event.inputs.source_ref }}"
          else
            # The Release workflow runs on a tag push; the tag name is
            # in `head_branch` of the workflow_run event.
            tag="${{ github.event.workflow_run.head_branch }}"
            version="${tag#v}"
            source_ref=""
          fi
          if [[ -z "$version" ]]; then
            echo "::error::could not resolve version"
            exit 1
          fi
          # Default `source_ref` to the tag matching the version.
          if [[ -z "$source_ref" ]]; then
            source_ref="v${version}"
          fi
          echo "version=$version"           >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref"     >> "$GITHUB_OUTPUT"
          echo "Publishing evault@$version to npm from ref $source_ref"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.source_ref }}

      - name: Verify npm/ exists at checked-out ref
        # Defensive guard: if the ref doesn't include the npm wrapper
        # (e.g. the tag predates its addition), fail HERE with a clear
        # actionable message instead of crashing later inside a
        # `working-directory: npm` step with the cryptic
        # "No such file or directory" from bash.
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d npm ]]; then
            echo "::error title=npm/ not found at $(git rev-parse HEAD)::"
            echo ""
            echo "The checked-out ref '${{ steps.resolve.outputs.source_ref }}'"
            echo "does not contain an 'npm/' directory. This usually means"
            echo "the tag was cut BEFORE the npm wrapper was added to the"
            echo "repository."
            echo ""
            echo "Two ways to fix this:"
            echo ""
            echo "  1. Move the tag to a commit that includes npm/:"
            echo "       git tag -d v${{ steps.resolve.outputs.version }}"
            echo "       git push origin :refs/tags/v${{ steps.resolve.outputs.version }}"
            echo "       git tag -a v${{ steps.resolve.outputs.version }} -m '...'"
            echo "       git push origin v${{ steps.resolve.outputs.version }}"
            echo "     The Release workflow will rerun and trigger this one"
            echo "     again automatically."
            echo ""
            echo "  2. Manually dispatch THIS workflow with source_ref=master"
            echo "     (Actions → Publish npm → Run workflow → set source_ref)."
            echo "     The npm publish will use the latest npm/ wrapper code"
            echo "     while still labelling the package with the tag's"
            echo "     version."
            exit 1
          fi
          echo "OK: npm/ exists at the checked-out ref."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync npm package versions to tag
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const version = process.env.VERSION;
          const root = process.cwd();
          const mainPath = path.join(root, "package.json");
          const main = JSON.parse(fs.readFileSync(mainPath, "utf8"));
          main.version = version;
          for (const name of Object.keys(main.optionalDependencies || {})) {
            main.optionalDependencies[name] = version;
          }
          fs.writeFileSync(mainPath, `${JSON.stringify(main, null, 2)}\n`);

          for (const dir of fs.readdirSync(path.join(root, "packages"))) {
            const pkgPath = path.join(root, "packages", dir, "package.json");
            if (!fs.existsSync(pkgPath)) continue;
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = version;
            fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE
        env:
          VERSION: ${{ steps.resolve.outputs.version }}

      - name: Download GitHub Release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "v${{ steps.resolve.outputs.version }}" \
            --dir dist \
            --pattern "evault-v${{ steps.resolve.outputs.version }}-*"
          ls -lah dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Stage platform package binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"

          stage_unix() {
            package_dir="$1"
            target="$2"
            mkdir -p "npm/packages/${package_dir}/bin"
            tar -xJf "dist/evault-v${version}-${target}.tar.xz" -C "npm/packages/${package_dir}/bin" evault
            chmod 0755 "npm/packages/${package_dir}/bin/evault"
            cp npm/packages/README.md "npm/packages/${package_dir}/README.md"
            cp LICENSE "npm/packages/${package_dir}/LICENSE"
          }

          stage_windows() {
            package_dir="$1"
            target="$2"
            mkdir -p "npm/packages/${package_dir}/bin"
            tmp="$(mktemp -d)"
            unzip -q "dist/evault-v${version}-${target}.zip" -d "$tmp"
            cp "$tmp/evault.exe" "npm/packages/${package_dir}/bin/evault.exe"
            cp npm/packages/README.md "npm/packages/${package_dir}/README.md"
            cp LICENSE "npm/packages/${package_dir}/LICENSE"
          }

          stage_unix linux-x64 x86_64-unknown-linux-gnu
          stage_unix darwin-x64 x86_64-apple-darwin
          stage_unix darwin-arm64 aarch64-apple-darwin
          stage_windows win32-x64 x86_64-pc-windows-msvc

      - name: Sanity check the package contents
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/*; do
            if [[ -f "$dir/package.json" ]]; then
              (cd "$dir" && npm pack --dry-run)
            fi
          done
          npm pack --dry-run

      - name: Publish platform packages to npm
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/linux-x64 packages/darwin-x64 packages/darwin-arm64 packages/win32-x64; do
            (cd "$dir" && npm publish --access public --provenance)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish wrapper to npm
        working-directory: npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Publish crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without "v", e.g. 0.1.1)'
        required: true
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.94"

jobs:
  publish:
    name: Publish workspace crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
          fi
          if [[ -z "$version" ]]; then
            echo "::error::could not resolve version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sync and verify workspace version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-release-version.mjs "${{ steps.version.outputs.version }}"
          cargo generate-lockfile
          actual=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "evault-cli") | .version')
          if [[ "$actual" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::workspace version $actual does not match release ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Verify crate readmes and repository metadata
        shell: bash
        run: |
          set -euo pipefail
          expected_repo="https://github.com/stescobedo92/hide-env-keys"
          crates=(
            evault-core
            evault-store-memory
            evault-store-keyring
            evault-store-sqlcipher
            evault-manifest
            evault-materializer
            evault-runner
            evault-scanner-regex
            evault-tui
            evault-cli
          )
          for crate in "${crates[@]}"; do
            repo=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .repository')
            readme=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .readme')
            if [[ "$repo" != "$expected_repo" ]]; then
              echo "::error::$crate repository is '$repo', expected '$expected_repo'"
              exit 1
            fi
            if [[ "$readme" != */README.md ]]; then
              echo "::error::$crate readme metadata is '$readme', expected README.md"
              exit 1
            fi
            if ! cargo package -p "$crate" --allow-dirty --no-verify --list | grep -qx "README.md"; then
              echo "::error::$crate package does not include README.md"
              exit 1
            fi
          done

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          crates=(
            evault-core
            evault-store-memory
            evault-store-keyring
            evault-store-sqlcipher
            evault-manifest
            evault-materializer
            evault-runner
            evault-scanner-regex
            evault-tui
            evault-cli
          )
          for crate in "${crates[@]}"; do
            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate" --locked
            echo "::endgroup::"
            # crates.io index propagation is eventually consistent. Give the
            # next dependent crate a short, boring window to see the previous
            # publish before resolving workspace path dependencies by version.
            sleep 20
          done
